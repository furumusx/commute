<title>通勤ダッシュボード</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --line: #dde3ea;
    --accent: #1f4e79;
    --accent-soft: #e6eef7;
    --free: #1b7f3b;
    --free-soft: #e3f4e8;
    --warn: #9a5b00;
    --warn-soft: #fff3df;
    --tabbar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --card: #1c222a; --text: #e9edf2; --muted: #9aa6b4; --line: #2c343e;
      --accent: #7fb2e5; --accent-soft: #1f2d3c; --free: #6fd08f; --free-soft: #17301f;
      --warn: #f0b860; --warn-soft: #33270f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 17px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-wrap: anywhere; word-break: normal;
  }
  header.appbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--accent); color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    font-weight: 700; font-size: 18px;
  }
  @media (prefers-color-scheme: dark) { header.appbar { color: #0e1620; } }
  main {
    max-width: 640px; margin: 0 auto;
    padding: 14px 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px);
  }
  section.view[hidden] { display: none; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .date-big { font-size: 30px; font-weight: 800; line-height: 1.2; }
  .date-sub { color: var(--muted); font-size: 15px; }
  .label { color: var(--muted); font-size: 14px; font-weight: 600; }
  .facility { font-size: 28px; font-weight: 800; line-height: 1.25; margin-top: 2px; }
  .off { font-size: 26px; font-weight: 800; }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent); margin-top: 6px;
  }
  .pill.free { background: var(--free-soft); color: var(--free); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .grid3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .metric { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .metric:last-child { border-bottom: none; }
  .metric .v { font-size: 22px; font-weight: 800; text-align: right; }
  .metric .v small { font-size: 14px; font-weight: 600; color: var(--muted); }
  h2 { font-size: 18px; margin: 18px 4px 8px; }
  .park-name { font-size: 18px; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .park-row { font-size: 15px; margin-top: 4px; }
  .park-row .k { color: var(--muted); display: inline-block; min-width: 3.5em; }
  .park-cost { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .park-facts { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .park-note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .sort-chips button { font-size: 15px; min-height: 44px; }
  a.btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 48px; margin-top: 10px; border-radius: 12px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 16px;
  }
  @media (prefers-color-scheme: dark) { a.btn { color: #0e1620; } }
  details.more { margin-top: 4px; }
  details.more > summary {
    cursor: pointer; min-height: 48px; display: flex; align-items: center; padding: 0 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 700;
    list-style: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more[open] > summary { margin-bottom: 12px; }
  .empty { color: var(--muted); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; }
  .stats td, .stats th { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--line); font-size: 15px; }
  .stats th:first-child, .stats td:first-child { text-align: left; }
  .stats th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .sample-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .sample-head .d { font-weight: 800; font-size: 17px; }
  .dir { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .dir.back { background: var(--warn-soft); color: var(--warn); }
  .sample-time { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .sample-time small { font-size: 15px; color: var(--muted); font-weight: 600; }
  .shift-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 52px; }
  .shift-row:last-child { border-bottom: none; }
  .shift-row .sd { width: 5.2em; flex: none; font-weight: 700; }
  .shift-row .sw { width: 1.6em; flex: none; color: var(--muted); }
  .shift-row .sw.sun { color: #c0392b; } .shift-row .sw.sat { color: #2471a3; }
  .shift-row .sp { flex: 1; min-width: 0; font-weight: 700; }
  .shift-row .sp.off { color: var(--muted); font-weight: 600; font-size: 17px; }
  .shift-row.today { background: var(--accent-soft); border-left: 5px solid var(--accent); }
  .shift-row.today .sd::after { content: "今日"; margin-left: 4px; font-size: 11px; background: var(--accent); color: #fff; padding: 1px 5px; border-radius: 6px; vertical-align: 2px; }
  .shift-list { padding: 0; overflow: hidden; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
  .chips button {
    appearance: none; font-family: inherit; font-size: 17px; font-weight: 800; min-height: 48px;
    border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--text);
  }
  .chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .chips button[aria-pressed="true"] { color: #0e1620; } }
  .now-arrive { font-size: 34px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
  .now-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .route-name { font-size: 17px; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .route-time { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .route-time small { font-size: 14px; color: var(--muted); font-weight: 600; }
  .fine { color: var(--muted); font-size: 13px; margin: 4px 4px 12px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; }
  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);

  nav.tabbar button {
    appearance: none; border: none; background: none; color: var(--muted);
    min-height: var(--tabbar-h); font-size: 16px; font-weight: 700; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  nav.tabbar button .ic { font-size: 20px; line-height: 1; }
  nav.tabbar button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
</style>

/* ===== 計算（DOM を使わない純粋関数。tests/test_data.js からも呼ぶ） ===== */
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const MAP_BASE = "https://www.google.com/maps/search/?api=1&query=";

function toMin(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
  if (!m) throw new Error("bad time: " + hhmm);

function fromMin(min) {
  const t = ((min % 1440) + 1440) % 1440;

}
function durationMin(depart, arrive) {
  let d = toMin(arrive) - toMin(depart);

  return d;
}
/** Asia/Tokyo の今日を YYYY-MM-DD で返す */
function todayTokyo(now) {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(now || new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}
/** YYYY-MM-DD の曜日（暦日として計算するのでタイムゾーンに依存しない） */
function weekdayOf(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}
function weekdayIndex(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
function splitPlace(place) {
  return place ? place.split("・").map((s) => s.trim()).filter(Boolean) : [];
}
function shiftOn(data, ymd) {
  return data.shifts.find((s) => s.date === ymd) || null;
}
function nextWorkShift(data, ymd) {
  return data.shifts.filter((s) => s.date > ymd && s.place).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
/** 施設への「行き」集計。0件なら count:0 と null */
function outboundStats(data, facility) {
  const xs = data.samples.filter((s) => s.dir === "行き" && s.facility === facility).map((s) => s.minutes);
  if (!xs.length) return { count: 0, min: null, max: null, avg: null };
  const sum = xs.reduce((a, b) => a + b, 0);
  return { count: xs.length, min: Math.min(...xs), max: Math.max(...xs), avg: Math.round((sum / xs.length) * 10) / 10 };
}
/** 到着見込み "08:18〜08:25頃"。実測なしなら null */
function arrivalWindow(depart, stats) {
  if (!stats || !stats.count) return null;
  const d = toMin(depart);
  if (stats.min === stats.max) return fromMin(d + stats.min) + "頃";
  return fromMin(d + stats.min) + "〜" + fromMin(d + stats.max) + "頃";
}
/** Asia/Tokyo の現在時刻を 0:00 からの分で返す */
function nowMinTokyo(now) {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(now || new Date());
  const get = (t) => Number(parts.find((p) => p.type === t).value);

function rangeText(r) {

}
/** 推奨ルート（recommended、無ければ先頭） */
function recommendedRoute(data, facility) {
  const rs = (data.routes && data.routes[facility]) || [];
  return rs.find((r) => r.recommended) || rs[0] || null;
}
/** 代表所要レンジ：「行き」実測が1件以上なら実測、無ければ推奨ルートの予想。どちらも無ければ null */
function representativeRange(data, facility) {
  const st = outboundStats(data, facility);
  const rr = recommendedRoute(data, facility);
  const predicted = rr && rr.predicted ? { min: rr.predicted.min, max: rr.predicted.max } : null;
  if (st.count) return { min: st.min, max: st.max, source: "実測", measured: st, predicted };
  if (predicted) return { min: predicted.min, max: predicted.max, source: "予想", measured: st, predicted };

/** 内訳の文字列 例: "実測 48〜55分・3件 ／ 予想 24〜55分" */
function rangeBreakdown(rep) {

  const b = rep.predicted ? "予想 " + rangeText(rep.predicted) : "予想なし";

}
/** 現在時刻(分)＋レンジで到着見込み "HH:MM〜HH:MM頃"（単値なら "HH:MM頃"） */
function arrivalFromNow(nowMin, range) {
  if (!range) return null;

/** ルート行の所要表示 例: "予想 24〜50分・実測37分（1件）" */
function routeTimeText(r) {

function navUrlFor(data, facility) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(data.navOrigin) +
    "&destination=" + encodeURIComponent(data.facilities[facility].address) + "&travelmode=driving";
}
function mapUrlFor(lot) {
  if (lot.mapUrl) return lot.mapUrl;
  // v1.2.1: mapCoord（"緯度,経度"）がある駐車場は座標検索（Googleマップに名称登録が無い所用）
  if (lot.mapCoord) return MAP_BASE + encodeURIComponent(lot.mapCoord);
  return MAP_BASE + encodeURIComponent(lot.name + " 鹿児島市" + lot.addr);
}
/** 駐車場の並び替え（v1.2.0）。mode: "rec"＝おすすめ順（データ順）／"cheap"＝安い順／"near"＝近い順
 *  職員駐車場（staff）はどの並びでも先頭に固定。null の距離は後ろ。最後はデータ順で安定させる */
const PARK_SORTS = [["rec", "おすすめ順"], ["cheap", "安い順"], ["near", "近い順"]];
function sortLots(lots, mode) {
  const nl = (v) => (v === null || v === undefined ? Infinity : v);
  const cmp = {
    cheap: (a, b) => a.lot.dayCost - b.lot.dayCost || nl(a.lot.distM) - nl(b.lot.distM),
    near: (a, b) => nl(a.lot.distM) - nl(b.lot.distM) || a.lot.dayCost - b.lot.dayCost

  return lots.map((lot, i) => ({ lot, i })).sort((a, b) =>

}
function samplesNewestFirst(data) {
  return data.samples.slice().sort((a, b) => b.date.localeCompare(a.date) || toMin(b.depart) - toMin(a.depart) || b.no - a.no);
}

  const [, m, d] = ymd.split("-").map(Number);
  return m + "/" + d;
}
function formatFee(fee) {
  if (fee === null || fee === undefined) return "未確定";
  if (fee === 0) return "0円（無料）";
  return fee.toLocaleString("ja-JP") + "円";

const CommuteCore = { APP_VER, DATA, toMin, fromMin, durationMin, todayTokyo, nowMinTokyo, weekdayOf, splitPlace, shiftOn, nextWorkShift, outboundStats, arrivalWindow, recommendedRoute, representativeRange, rangeBreakdown, arrivalFromNow, routeTimeText, routeKind, navUrlFor, mapUrlFor, samplesNewestFirst, formatFee, sortLots, PARK_SORTS, yen };

/* ===== 描画（テキストは textContent のみで入れる） ===== */
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(children || [])) {
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}

/** 駐車場の並び順（全体で1つ。行き先を切り替えても保持する） */

/** 今日タブの選択状態（日付が変わったら初期選択に戻す） */

/**

function renderToday(view, ymd, nowMin, selected) {

  if (selected === undefined) selected = working ? places[0] : null;
  todayState.date = ymd; todayState.facility = selected;

  view.replaceChildren();
  const [, m, d] = ymd.split("-").map(Number);

          ])

  }
}

function renderShift(view, ymd) {
  view.replaceChildren();
  view.appendChild(el("h2", { text: "2026年11月のシフト（" + DATA.shiftHours + "）" }));
  const list = el("div", { class: "card shift-list" });
  for (const s of DATA.shifts.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    const wi = weekdayIndex(s.date);
    list.appendChild(el("div", { class: "shift-row" + (s.date === ymd ? " today" : "") }, [
      el("span", { class: "sd", text: formatMD(s.date) }),
      el("span", { class: "sw" + (wi === 0 ? " sun" : wi === 6 ? " sat" : ""), text: WEEK[wi] }),
      el("span", { class: "sp" + (s.place ? "" : " off"), text: s.place ? splitPlace(s.place).join(" → ") : "休み" })
    ]));
  }
  view.appendChild(list);
}

function boot() {
  document.getElementById("app-ver").textContent = APP_VER;
  const views = { today: document.getElementById("view-today"), samples: document.getElementById("view-samples"), shift: document.getElementById("view-shift") };
  let renderedFor = null;
  let renderedMin = null;
  function renderAll() {
    const ymd = todayTokyo();
    const nowMin = nowMinTokyo();
    if (ymd !== renderedFor) {
      renderedFor = ymd;
      renderSamples(views.samples);
      renderShift(views.shift, ymd);
      renderedMin = nowMin;
      renderToday(views.today, ymd, nowMin); // 日付が変わったら初期選択に戻す
      return;
    }
    // 同じ日なら「今出発すると」の時刻だけ更新（選択中の行き先は維持）
    if (nowMin !== renderedMin) {
      renderedMin = nowMin;
      const old = views.today.querySelector(".now-card");
      if (old && todayState.facility) old.replaceWith(nowCard(todayState.facility, nowMin));
    }
  }
  function show(tab) {
    for (const k of Object.keys(views)) views[k].hidden = k !== tab;
    for (const b of document.querySelectorAll("nav.tabbar button")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    window.scrollTo(0, 0);
  }
  for (const b of document.querySelectorAll("nav.tabbar button")) b.addEventListener("click", () => show(b.dataset.tab));
  // ホーム画面アプリは開きっぱなしになりやすいので、復帰時に日付が変わっていれば描き直す
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderAll(); });
  setInterval(() => { if (!document.hidden) renderAll(); }, 30000);
  renderAll();
  show("today");
}

if (typeof document !== "undefined") boot();
</script>
