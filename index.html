<style>

  :root {
    --bg: #f4f4f4;
    --card: #fff;
    --ink: #141414;
    --line: #dedede;
    --mute: #8a8a8a;
    --red: #e60012;
    --soft: #f0f0f0;
    --tabbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* v1.3.0: ダブルタップ拡大の無効化 */
  html, body, button, a, summary { touch-action: manipulation; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-wrap: anywhere; word-break: normal;
  }
  header.appbar {

    background: var(--card); color: var(--ink); border-bottom: 1px solid var(--line);

  .date-sub { color: var(--mute); font-size: 13px; }
  .label { color: var(--mute); font-size: 13px; }
  .facility { font-size: 20px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
  .off { font-size: 20px; font-weight: 700; }
  .pill {
    display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--soft); color: var(--ink); margin-top: 6px;

  .park-name .pill { margin-top: 0; }
  .grid3 { display: grid; grid-template-columns: 1fr; gap: 10px; }

  .metric .v { font-size: 20px; font-weight: 700; text-align: right; }

  h2 { font-size: 15px; font-weight: 700; margin: 18px 4px 8px; }

  .park-cost { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .park-facts { font-size: 14px; margin-top: 2px; }
  .park-note { font-size: 12px; color: var(--mute); margin-top: 4px; }

  .shift-row.editing { outline: 1px solid var(--red); outline-offset: -1px; }

  .month-nav h2 { margin: 0; text-align: center; font-size: 20px; }

  .reset-btn { width: 100%; margin-top: 8px; color: var(--red); }

  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet .fine { margin: 10px 0 0; text-align: center; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
  .chips.two { grid-template-columns: repeat(2, 1fr); }
  .chips button {

    font-family: inherit; font-size: 16px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    appearance: none; -webkit-appearance: none;

  .rec-form select { appearance: auto; -webkit-appearance: menulist; }
  .rec-save {
    appearance: none; -webkit-appearance: none; width: 100%; min-height: 46px; margin-top: 14px;

    font-family: inherit; font-size: 15px; font-weight: 700;

  .form-msg { font-size: 13px; color: var(--red); margin-top: 8px; }
  .form-msg:empty { display: none; }
  .form-msg.ok { color: var(--mute); }
  .rec-del { min-height: 32px; padding: 0 10px; font-size: 12px; color: var(--red); }

  nav.tabbar.tabbar-pill {
    position: fixed; z-index: 10;
    left: 0; right: 0; margin: 0 auto;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: calc(100% - 32px); max-width: 420px; height: var(--tabbar-h);
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
    overflow: hidden;
  }
  nav.tabbar button {
    appearance: none; -webkit-appearance: none; border: none; background: none; color: var(--mute);
    font-size: 11px; font-weight: 600; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  nav.tabbar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabbar button.is-active { color: var(--red); }
</style>
</head>

/* ===== シフト（v1.3.0: 日付キー → 拠点IDの配列（勤務順）。空配列＝休み／キーが無い日＝未登録） ===== */
const PLACE_IDS = { higashi: "東千石", kamino: "上之園", arata: "上荒田" };
const SHIFT_KEY = "commute.shifts.v1";
const MAX_PLACES = 2;
const DEFAULT_SHIFTS = {
  "2026-11-16": ["higashi"],
  "2026-11-17": ["higashi", "kamino"],
  "2026-11-18": ["higashi"],
  "2026-11-19": ["kamino"],
  "2026-11-20": [],
  "2026-11-21": [],
  "2026-11-22": [],
  "2026-11-23": ["higashi", "kamino"],
  "2026-11-24": ["arata"],
  "2026-11-25": ["higashi"],
  "2026-11-26": ["kamino"],
  "2026-11-27": ["kamino", "arata"],
  "2026-11-28": [],
  "2026-11-29": [],
  "2026-11-30": ["higashi", "kamino"]
};

function cloneShifts(m) {
  const o = {};
  for (const k of Object.keys(m)) o[k] = m[k].slice();
  return o;
}
/** 保存値の検証。形が壊れていれば null（未知の拠点IDは捨て、重複を除き、最大2つ） */
function cleanShifts(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const o = {};
  for (const k of Object.keys(raw)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(raw[k])) continue;
    const ids = [];
    for (const id of raw[k]) if (Object.prototype.hasOwnProperty.call(PLACE_IDS, id) && !ids.includes(id)) ids.push(id);
    o[k] = ids.slice(0, MAX_PLACES);
  }
  return o;
}
/** localStorage（使えない環境では null。アクセス自体が例外になる環境もある） */
function getStorage() {
  try { return globalThis.localStorage || null; } catch (e) { return null; }
}
/** 保存値があればそれを、無ければ（壊れていれば）DEFAULT_SHIFTS の複製 */
function loadShifts(storage) {
  if (storage) {
    try {
      const v = storage.getItem(SHIFT_KEY);
      if (v) { const c = cleanShifts(JSON.parse(v)); if (c) return c; }
    } catch (e) { /* 読めなければ初期値 */ }
  }
  return cloneShifts(DEFAULT_SHIFTS);
}
function saveShifts(storage, shifts) {
  if (!storage) return false;
  try { storage.setItem(SHIFT_KEY, JSON.stringify(shifts)); return true; } catch (e) { return false; }
}
function clearShifts(storage) {
  if (!storage) return;
  try { storage.removeItem(SHIFT_KEY); } catch (e) { /* メモリ上だけ戻す */ }
}
/** チップのトグル：選択済みなら外す／未選択なら末尾に足す（最大2つ。3つ目は無視） */
function toggleShiftPlace(ids, id) {
  if (ids.includes(id)) return ids.filter((x) => x !== id);
  if (ids.length >= MAX_PLACES) return ids.slice();
  return ids.concat([id]);
}
function placeNames(ids) {
  return (ids || []).map((id) => PLACE_IDS[id]).filter(Boolean);
}
/** 表示用の勤務内容 "東千石 → 上之園" ／ "休み" */
function shiftLabel(ids) {
  const n = placeNames(ids);
  return n.length ? n.join(" → ") : "休み";
}
function daysInMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function addMonth(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1 + delta, 1));
  return t.getUTCFullYear() + "-" + String(t.getUTCMonth() + 1).padStart(2, "0");
}
function monthDates(ym) {
  const out = [];
  for (let d = 1; d <= daysInMonth(ym); d++) out.push(ym + "-" + String(d).padStart(2, "0"));
  return out;
}

/** 現在のシフト（初回アクセス時に保存値を読む）。編集は setShift / resetShifts 経由で即保存 */
const shiftStore = { storage: undefined, data: null, onChange: null };
function currentShifts() {
  if (!shiftStore.data) {
    shiftStore.storage = getStorage();
    shiftStore.data = loadShifts(shiftStore.storage);
  }
  return shiftStore.data;
}
function setShift(ymd, ids) {
  currentShifts()[ymd] = ids.slice();
  saveShifts(shiftStore.storage, shiftStore.data);
  if (shiftStore.onChange) shiftStore.onChange();
}
function resetShifts() {
  currentShifts();
  clearShifts(shiftStore.storage);
  shiftStore.data = cloneShifts(DEFAULT_SHIFTS);
  if (shiftStore.onChange) shiftStore.onChange();
}

/* ===== 記録（v1.4.0: ページ内入力。localStorage に配列で保存。初期サンプル DATA.samples は別扱い・削除不可） ===== */
const RECORD_KEY = "commute.records.v1";
const DIR_LABEL = { out: "行き", back: "帰り" };
const HHMM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
/** 1件の検証。必須は id・日付・区分・行き先。時刻・駐車場・料金は空欄可（null） */
function cleanRecord(r) {
  if (!r || typeof r !== "object") return null;
  if (typeof r.id !== "string" || !r.id) return null;
  if (typeof r.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return null;
  if (!Object.prototype.hasOwnProperty.call(DIR_LABEL, r.dir)) return null;
  if (!Object.prototype.hasOwnProperty.call(PLACE_IDS, r.fac)) return null;
  const t = (v) => (typeof v === "string" && HHMM_RE.test(v) ? v : null);
  const lot = typeof r.lot === "string" && r.lot.trim() ? r.lot.trim().slice(0, 80) : null;
  const fee = typeof r.fee === "number" && Number.isFinite(r.fee) && r.fee >= 0 ? Math.round(r.fee) : null;
  return { id: r.id, date: r.date, dir: r.dir, fac: r.fac, dep: t(r.dep), arr: t(r.arr), lot, fee };
}
function cleanRecords(raw) {
  if (!Array.isArray(raw)) return [];
  const seen = new Set();
  const out = [];
  for (const r of raw) {
    const c = cleanRecord(r);
    if (c && !seen.has(c.id)) { seen.add(c.id); out.push(c); }
  }
  return out;
}
function loadRecords(storage) {
  if (!storage) return [];
  try { const v = storage.getItem(RECORD_KEY); return v ? cleanRecords(JSON.parse(v)) : []; } catch (e) { return []; }
}
function saveRecords(storage, recs) {
  if (!storage) return false;
  try { storage.setItem(RECORD_KEY, JSON.stringify(recs)); return true; } catch (e) { return false; }
}
function newRecordId() {
  return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
const recordStore = { storage: undefined, data: null, onChange: null };
function currentRecords() {
  if (!recordStore.data) {
    recordStore.storage = getStorage();
    recordStore.data = loadRecords(recordStore.storage);
  }
  return recordStore.data;
}
/** 追加（検証を通らなければ null）。保存は即時 */
function addRecord(rec) {
  const c = cleanRecord(Object.assign({ id: newRecordId() }, rec));
  if (!c) return null;
  currentRecords().push(c);
  saveRecords(recordStore.storage, recordStore.data);
  if (recordStore.onChange) recordStore.onChange();
  return c;
}
function deleteRecord(id) {
  const before = currentRecords().length;
  recordStore.data = recordStore.data.filter((r) => r.id !== id);
  const changed = recordStore.data.length !== before;
  if (changed) {
    saveRecords(recordStore.storage, recordStore.data);
    if (recordStore.onChange) recordStore.onChange();
  }
  return changed;
}

/* ===== 計算（DOM を使わない純粋関数。tests/test_data.js からも呼ぶ） ===== */
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const MAP_BASE = "https://www.google.com/maps/search/?api=1&query=";

function toMin(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
  if (!m) throw new Error("bad time: " + hhmm);
  return Number(m[1]) * 60 + Number(m[2]);
}
function fromMin(min) {
  const t = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}
function durationMin(depart, arrive) {
  let d = toMin(arrive) - toMin(depart);
  if (d < 0) d += 1440;
  return d;
}
/** Asia/Tokyo の今日を YYYY-MM-DD で返す */
function todayTokyo(now) {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(now || new Date());
  const get = (t) => parts.find((p) => p.type === t).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}
/** YYYY-MM-DD の曜日（暦日として計算するのでタイムゾーンに依存しない） */
function weekdayOf(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}
function weekdayIndex(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
function splitPlace(place) {
  return place ? place.split("・").map((s) => s.trim()).filter(Boolean) : [];
}
/** その日のシフト { date, place }（place は「・」区切りの施設名、休みは null）。未登録の日は null */
function shiftOn(shifts, ymd) {
  if (!Object.prototype.hasOwnProperty.call(shifts, ymd)) return null;
  const n = placeNames(shifts[ymd]);
  return { date: ymd, place: n.length ? n.join("・") : null };
}
function nextWorkShift(shifts, ymd) {
  const d = Object.keys(shifts).filter((k) => k > ymd && placeNames(shifts[k]).length).sort()[0];
  return d ? shiftOn(shifts, d) : null;
}
/** v1.4.1: 実測集計に入れるユーザー記録の所要時間の範囲（分） */
const USER_MIN_MINUTES = 5;
const USER_MAX_MINUTES = 180;
/** v1.4.1: ユーザー記録のうち、施設への「行き」で出発・到着が両方あり所要 5〜180分のものの所要（分）の配列 */
function userOutboundMinutes(userRecs, facility) {
  return (userRecs || [])
    .filter((r) => r && r.dir === "out" && PLACE_IDS[r.fac] === facility && r.dep && r.arr)
    .map((r) => durationMin(r.dep, r.arr))
    .filter((m) => m >= USER_MIN_MINUTES && m <= USER_MAX_MINUTES);
}
/** 施設への「行き」集計。0件なら count:0 と null。
 *  v1.4.1: userRecs（commute.records.v1 の配列）を渡すと条件を満たす記録を合算し、userCount にその件数を入れる */
function outboundStats(data, facility, userRecs) {
  const base = data.samples.filter((s) => s.dir === "行き" && s.facility === facility).map((s) => s.minutes);
  const mine = userOutboundMinutes(userRecs, facility);
  const xs = base.concat(mine);
  if (!xs.length) return { count: 0, min: null, max: null, avg: null, userCount: 0 };
  const sum = xs.reduce((a, b) => a + b, 0);
  return { count: xs.length, min: Math.min(...xs), max: Math.max(...xs), avg: Math.round((sum / xs.length) * 10) / 10, userCount: mine.length };
}
/** 到着見込み "08:18〜08:25頃"。実測なしなら null */
function arrivalWindow(depart, stats) {
  if (!stats || !stats.count) return null;
  const d = toMin(depart);
  if (stats.min === stats.max) return fromMin(d + stats.min) + "頃";
  return fromMin(d + stats.min) + "〜" + fromMin(d + stats.max) + "頃";
}
/** Asia/Tokyo の現在時刻を 0:00 からの分で返す */
function nowMinTokyo(now) {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(now || new Date());
  const get = (t) => Number(parts.find((p) => p.type === t).value);
  return get("hour") * 60 + get("minute");
}
function rangeText(r) {
  return r.min === r.max ? r.min + "分" : r.min + "〜" + r.max + "分";
}
/** 推奨ルート（recommended、無ければ先頭） */
function recommendedRoute(data, facility) {
  const rs = (data.routes && data.routes[facility]) || [];
  return rs.find((r) => r.recommended) || rs[0] || null;
}
/** 代表所要レンジ：「行き」実測が1件以上なら実測、無ければ推奨ルートの予想。どちらも無ければ null */
function representativeRange(data, facility, userRecs) {
  const st = outboundStats(data, facility, userRecs);
  const rr = recommendedRoute(data, facility);
  const predicted = rr && rr.predicted ? { min: rr.predicted.min, max: rr.predicted.max } : null;
  if (st.count) return { min: st.min, max: st.max, source: "実測", measured: st, predicted };
  if (predicted) return { min: predicted.min, max: predicted.max, source: "予想", measured: st, predicted };
  return null;
}
/** 内訳の文字列 例: "実測 48〜55分・3件 ／ 予想 24〜55分"
 *  v1.4.1: ユーザー記録を含むときは "実測 45〜55分・4件（あなたの記録1件を含む） ／ 予想 24〜55分" */
function rangeBreakdown(rep) {
  const m = rep.measured;
  const a = m && m.count
    ? "実測 " + rangeText(m) + "・" + m.count + "件" + (m.userCount ? "（あなたの記録" + m.userCount + "件を含む）" : "")
    : "実測なし";
  const b = rep.predicted ? "予想 " + rangeText(rep.predicted) : "予想なし";
  return a + " ／ " + b;
}
/** 現在時刻(分)＋レンジで到着見込み "HH:MM〜HH:MM頃"（単値なら "HH:MM頃"） */
function arrivalFromNow(nowMin, range) {
  if (!range) return null;
  return arrivalWindow(fromMin(nowMin), { count: 1, min: range.min, max: range.max });
}
/** ルート行の所要表示 例: "予想 24〜50分・実測37分（1件）" */
function routeTimeText(r) {
  const parts = [];
  if (r.predicted) parts.push("予想 " + rangeText(r.predicted));
  if (r.measured) parts.push("実測" + (r.predicted ? "" : " ") + rangeText(r.measured) + "（" + r.measured.count + "件）");
  return parts.join("・") || "—";
}
function routeKind(r) {
  return r.measured && r.predicted ? "予想＋実測" : r.measured ? "実測" : "予想";
}
function navUrlFor(data, facility) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(data.navOrigin) +
    "&destination=" + encodeURIComponent(data.facilities[facility].address) + "&travelmode=driving";
}
function mapUrlFor(lot) {
  if (lot.mapUrl) return lot.mapUrl;
  // v1.2.1: mapCoord（"緯度,経度"）がある駐車場は座標検索（Googleマップに名称登録が無い所用）
  if (lot.mapCoord) return MAP_BASE + encodeURIComponent(lot.mapCoord);
  return MAP_BASE + encodeURIComponent(lot.name + " 鹿児島市" + lot.addr);

/** 駐車場の並び替え（v1.2.0）。mode: "rec"＝おすすめ順（データ順）／"cheap"＝安い順／"near"＝近い順

  const dirChips = chipGroup("rec-dir", "区分", Object.keys(DIR_LABEL).map((k) => [k, DIR_LABEL[k]]), recForm.dir, (k) => { recForm.dir = k; }, "two");
  const facChips = chipGroup("rec-fac", "行き先", Object.keys(PLACE_IDS).map((k) => [k, PLACE_IDS[k]]), recForm.fac, (k) => {
    if (k !== recForm.fac) { recForm.fac = k; recForm.lot = ""; recForm.fee = ""; }
  });
  const save = el("button", { type: "button", class: "rec-save", text: "記録する" });
  save.addEventListener("click", () => {
    sync();
    const err = (m) => { recForm.msg = m; recForm.ok = false; redraw(); };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(recForm.date)) return err("日付を入れてください");
    if (recForm.dep && !HHMM_RE.test(recForm.dep)) return err("出発の時刻が読めません");
    if (recForm.arr && !HHMM_RE.test(recForm.arr)) return err("到着の時刻が読めません");
    let feeVal = null;
    if (recForm.fee.trim() !== "") {
      feeVal = Number(recForm.fee);
      if (!Number.isFinite(feeVal) || feeVal < 0) return err("料金は0以上の数字で入れてください");
    }
    const saved = addRecord({ date: recForm.date, dir: recForm.dir, fac: recForm.fac, dep: recForm.dep || null, arr: recForm.arr || null, lot: recForm.lot || null, fee: feeVal });
    if (!saved) return err("記録できませんでした");
    // 日付・区分・行き先は残し、時刻・駐車場・料金は空に戻す
    recForm.dep = ""; recForm.arr = ""; recForm.lot = ""; recForm.fee = "";
    recForm.msg = formatMD(saved.date) + " " + PLACE_IDS[saved.fac] + "（" + DIR_LABEL[saved.dir] + "）を記録しました";
    recForm.ok = true;
    redraw();
  });
  const field = (label, ctrl) => el("div", { class: "field" }, [el("div", { class: "label", text: label }), ctrl]);
  return el("div", { class: "card rec-form" }, [
    field("日付", date),
    field("区分", dirChips),
    field("行き先", facChips),
    el("div", { class: "field row2" }, [
      el("div", null, [el("div", { class: "label", text: "出発" }), dep]),
      el("div", null, [el("div", { class: "label", text: "到着" }), arr])
    ]),
    field("使った駐車場", lot),
    field("料金（円）", fee),
    save,
    el("div", { class: "form-msg" + (recForm.ok ? " ok" : ""), role: "status", text: recForm.msg }),
    el("div", { class: "fine", style: "margin:8px 0 0", text: "入力した記録はこの端末にだけ保存されます。時刻・駐車場・料金は空欄でも記録できます。" })
  ]);
}

/** シフトタブの表示状態（今日が変わったら今月・パネル閉に戻す） */
const shiftUi = { today: null, month: null, editing: null };

/** v1.3.0: シフトタブ（月切り替え・行タップで編集パネル・端末内保存・リセット） */
function renderShift(view, ymd) {
  if (ymd !== shiftUi.today) { shiftUi.today = ymd; shiftUi.month = ymd.slice(0, 7); shiftUi.editing = null; }
  const redraw = () => renderShift(view, ymd);
  const shifts = currentShifts();
  const ym = shiftUi.month;
  const [y, m] = ym.split("-").map(Number);

  view.replaceChildren();
  const prev = el("button", { type: "button", class: "month-prev", "aria-label": "前月", text: "‹ 前月" });
  const next = el("button", { type: "button", class: "month-next", "aria-label": "翌月", text: "翌月 ›" });
  prev.addEventListener("click", () => { shiftUi.month = addMonth(shiftUi.month, -1); shiftUi.editing = null; redraw(); });
  next.addEventListener("click", () => { shiftUi.month = addMonth(shiftUi.month, 1); shiftUi.editing = null; redraw(); });
  view.appendChild(el("div", { class: "month-nav" }, [prev, el("h2", { class: "month-title", text: y + "年" + m + "月" }), next]));
  view.appendChild(el("div", { class: "fine", text: DATA.shiftHours + "　日付をタップすると勤務先を入力できます。" }));

  const list = el("div", { class: "card shift-list" });
  for (const d of monthDates(ym)) {
    const wi = weekdayIndex(d);
    const ids = shifts[d] || [];
    const row = el("button", { type: "button", class: "shift-row" + (d === ymd ? " today" : "") + (d === shiftUi.editing ? " editing" : ""), "data-date": d }, [
      el("span", { class: "sd", text: formatMD(d) }),
      el("span", { class: "sw" + (wi === 0 ? " sun" : wi === 6 ? " sat" : ""), text: WEEK[wi] }),
      el("span", { class: "sp" + (ids.length ? "" : " off"), text: shiftLabel(ids) })
    ]);
    row.addEventListener("click", () => { shiftUi.editing = d; redraw(); });
    list.appendChild(row);
  }
  view.appendChild(list);

  const reset = el("button", { type: "button", class: "reset-btn", text: "入力をリセット" });
  reset.addEventListener("click", () => {
    const ok = typeof globalThis.confirm === "function" ? globalThis.confirm("入力したシフトを消して、最初の状態に戻しますか？") : false;
    if (!ok) return;
    shiftUi.editing = null;
    resetShifts();
    redraw();
  });
  view.appendChild(reset);

  if (shiftUi.editing) for (const n of shiftSheet(shiftUi.editing, redraw)) view.appendChild(n);
}

/** 編集パネル（シート）。チップを押した時点で即保存 */
function shiftSheet(d, redraw) {
  const ids = currentShifts()[d] || [];
  const close = () => { shiftUi.editing = null; redraw(); };
  const backdrop = el("div", { class: "sheet-backdrop" });
  backdrop.addEventListener("click", close);
  const [, m, day] = d.split("-").map(Number);
  const chips = el("div", { class: "chips", role: "group", "aria-label": "勤務先" }, Object.keys(PLACE_IDS).map((id) => {
    const idx = ids.indexOf(id);
    const b = el("button", { type: "button", class: "place-chip", "data-place": id, "aria-pressed": String(idx >= 0) }, [
      PLACE_IDS[id],
      idx >= 0 && ids.length > 1 ? el("span", { class: "ord", text: String(idx + 1) }) : null
    ]);
    if (idx < 0 && ids.length >= MAX_PLACES) { b.disabled = true; b.setAttribute("disabled", ""); }
    b.addEventListener("click", () => { setShift(d, toggleShiftPlace(currentShifts()[d] || [], id)); redraw(); });
    return b;
  }));
  const off = el("button", { type: "button", class: "sheet-off", text: "休みにする" });
  off.addEventListener("click", () => { setShift(d, []); redraw(); });
  const closeBtn = el("button", { type: "button", class: "sheet-close", text: "閉じる" });
  closeBtn.addEventListener("click", close);
  const sheet = el("div", { class: "sheet", role: "dialog", "aria-label": "シフトの編集" }, [
    el("div", { class: "sheet-title", text: m + "月" + day + "日（" + weekdayOf(d) + "）" }),
    el("div", { class: "sheet-now", text: "現在：" + shiftLabel(ids) + "　（2つまで・押した順が勤務順）" }),
    chips,
    el("div", { class: "sheet-actions" }, [off, closeBtn]),
    el("div", { class: "fine", text: "シフトの入力はこの端末にだけ保存されます" })
  ]);
  return [backdrop, sheet];
}

/** v1.4.0: タブの選択表示（選択中＝is-active で赤）。返り値は選択中タブのラベル */
const TAB_NAMES = { today: "今日", samples: "記録", shift: "シフト" };
function setActiveTab(buttons, tab) {
  for (const b of buttons) {
    const on = b.dataset.tab === tab;
    b.setAttribute("aria-selected", String(on));
    if (b.classList) b.classList.toggle("is-active", on);
    else b.className = on ? "is-active" : "";
  }
  return TAB_NAMES[tab] || "";
}

function boot() {
  document.getElementById("app-ver").textContent = APP_VER;
  const views = { today: document.getElementById("view-today"), samples: document.getElementById("view-samples"), shift: document.getElementById("view-shift") };
  let renderedFor = null;
  let renderedMin = null;
  function renderAll() {
    const ymd = todayTokyo();
    const nowMin = nowMinTokyo();
    if (ymd !== renderedFor) {
      renderedFor = ymd;
      renderSamples(views.samples, ymd);
      renderShift(views.shift, ymd);
      renderedMin = nowMin;
      renderToday(views.today, ymd, nowMin); // 日付が変わったら初期選択に戻す
      return;
    }
    // 同じ日なら「今出発すると」の時刻だけ更新（選択中の行き先は維持）
    if (nowMin !== renderedMin) {
      renderedMin = nowMin;
      const old = views.today.querySelector(".now-card");
      if (old && todayState.facility) old.replaceWith(nowCard(todayState.facility, nowMin));
    }
  }
  function show(tab) {
    for (const k of Object.keys(views)) views[k].hidden = k !== tab;
    document.getElementById("tab-name").textContent = setActiveTab(document.querySelectorAll("nav.tabbar button"), tab);
    window.scrollTo(0, 0);
  }
  for (const b of document.querySelectorAll("nav.tabbar button")) b.addEventListener("click", () => show(b.dataset.tab));
  // v1.3.0: シフトを編集したら今日タブ（今日の勤務・次の勤務・行き先の初期選択）を描き直す
  shiftStore.onChange = () => renderToday(views.today, renderedFor || todayTokyo(), nowMinTokyo());
  // v1.4.1: 記録を追加・削除したら「今出発すると」カードの実測レンジを更新（選択中の行き先は維持）
  recordStore.onChange = () => {
    const old = views.today.querySelector(".now-card");
    if (old && todayState.facility) old.replaceWith(nowCard(todayState.facility, nowMinTokyo()));
  };
  // v1.3.0: ダブルタップ拡大の無効化（入力欄は除外）
  document.addEventListener("dblclick", (e) => {
    const t = e.target;
    if (t && t.closest && t.closest("input, textarea")) return;
    e.preventDefault();
  }, { passive: false });
  // ホーム画面アプリは開きっぱなしになりやすいので、復帰時に日付が変わっていれば描き直す
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderAll(); });
  setInterval(() => { if (!document.hidden) renderAll(); }, 30000);
  renderAll();
  show("today");
}

if (typeof document !== "undefined") boot();
</script>
